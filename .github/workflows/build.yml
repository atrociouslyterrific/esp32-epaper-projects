name: Build sketches

on:
  push:
    branches-ignore: [status]
    paths:  # only when a program's code changes (website/training pushes don't need a build)
      - "EpaperHello/**"
      - "EpaperPet/**"
      - "PipAI/**"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:
  workflow_run:  # rebuild after a new brain is trained
    workflows: ["Train Pip brain"]
    types: [completed]

permissions:
  contents: write  # lets the build publish the "latest" download

# One build at a time. A newer waiting build replaces an older waiting one, but a
# build that's already running is never cancelled.
concurrency:
  group: build
  cancel-in-progress: false

env:
  # The V2 board has 8 MB of flash: two 3 MB program slots (so Pip can download an update
  # into the spare one over Wi-Fi) plus 1.5 MB of file storage (Pip saves its learning there).
  FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PartitionScheme=default_8MB

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm  # ARM pool: the x64 ubuntu-latest/24.04 runners stopped picking up jobs (Nov 2026)
    timeout-minutes: 30  # a normal build takes ~5 min; never sit for GitHub's 6-hour default
    strategy:
      fail-fast: false
      matrix:
        sketch: [EpaperHello, EpaperPet, PipAI]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

      - name: Get the newest trained brain and voice
        if: matrix.sketch == 'PipAI'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download checkpoints -R "${{ github.repository }}" -p pip_brain.h -p pip_voice.h -D PipAI --clobber \
            && echo "Using the models from the checkpoints release" \
            || echo "No models in the checkpoints release yet - using the repo's copies"
          # Pip's movement model (newer; Pip uses its hand-made moves until one has been trained)
          gh release download checkpoints -R "${{ github.repository }}" -p pip_motion.h -D PipAI --clobber \
            && echo "Using the motion model from the checkpoints release" \
            || echo "No motion model yet - Pip uses its hand-made moves"

      - name: Check the sketch is ready
        id: ready
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ matrix.sketch }}" != "PipAI" ]; then
            echo "Only PipAI changes after training - skipping ${{ matrix.sketch }}."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.sketch }}" = "PipAI" ] && { [ ! -f PipAI/pip_brain.h ] || [ ! -f PipAI/pip_voice.h ]; }; then
            echo "PipAI's brain or voice hasn't been trained yet - skipping until training finishes."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.sketch }}" = "PipAI" ] && grep -q 'pip_hidden(' PipAI/PipAI.ino && ! grep -q 'pip_hidden' PipAI/pip_brain.h; then
            # The program was changed to use a new kind of brain, but the saved brain is still
            # the old kind. Training is making the new one; the build runs again when it's done.
            echo "PipAI's saved brain is older than the program (no pip_hidden) - skipping until training finishes."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.sketch }}" = "PipAI" ] && \
               [ "$(grep -oP 'define PIP_N_FEATURES \K[0-9]+' PipAI/pip_world.h)" != "$(grep -oP 'define PIP_N_IN \K[0-9]+' PipAI/pip_brain.h)" ]; then
            # Pip's senses changed (e.g. habituation was added); the saved brain was trained for the old ones.
            echo "PipAI's saved brain was trained for different senses - skipping until training finishes."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: arduino/setup-arduino-cli@v2
        if: steps.ready.outputs.go == 'true'

      - name: Reuse the ESP32 tools from earlier builds (saves a couple of minutes)
        if: steps.ready.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-arm-${{ runner.os }}-v1

      - name: Install ESP32 core and libraries
        if: steps.ready.outputs.go == 'true'
        run: |
          arduino-cli config init --overwrite   # the cached tools may already include a settings file
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core list | grep -q "^esp32:esp32" || arduino-cli core install esp32:esp32
          arduino-cli lib list | grep -q "^GxEPD2" || arduino-cli lib install GxEPD2

      - name: Stamp the version number (Pip compares it to decide whether to update)
        if: steps.ready.outputs.go == 'true' && matrix.sketch == 'PipAI'
        run: |
          echo "#define PIP_FW_VERSION ${{ github.run_number }}" > PipAI/pip_version.h
          echo "PipAI version ${{ github.run_number }}"

      - name: Compile
        if: steps.ready.outputs.go == 'true'
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build ${{ matrix.sketch }}

      - name: Name the program files
        if: steps.ready.outputs.go == 'true'
        run: |
          cp build/${{ matrix.sketch }}.ino.merged.bin ${{ matrix.sketch }}.bin    # whole flash, for esptool-js at 0x0
          if [ "${{ matrix.sketch }}" = "PipAI" ]; then
            cp build/PipAI.ino.bin PipAI-ota.bin                             # just the program, for Wi-Fi updates
            echo "${{ github.run_number }}" > PipAI.version
            # Which brain and voice went into this program (read from the files actually compiled)
            B=$(grep -oP 'PIP_BRAIN_VERSION \K[0-9]+' PipAI/pip_brain.h || echo 0)
            V=$(grep -oP 'PV_VOICE_VERSION \K[0-9]+' PipAI/pip_voice.h || echo 0)
            printf "B=%s\nV=%s\n" "$B" "$V" > PipAI.models
            ls -l PipAI-ota.bin; cat PipAI.models
          fi

      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: ${{ matrix.sketch }}
          path: |
            ${{ matrix.sketch }}.bin
            PipAI-ota.bin
            PipAI.version
            PipAI.models

  publish:
    # Put the newest program files on the "latest" release page for easy download.
    needs: build
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run')
    runs-on: ubuntu-24.04-arm  # ARM pool: the x64 ubuntu-latest/24.04 runners stopped picking up jobs (Nov 2026)
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest program files" \
              --notes "Flash with https://espressif.github.io/esptool-js/ at address 0x0."
          # Upload the program first and the version number last, so Pip never sees a new
          # version number before the matching program is there to download.
          gh release upload latest *.bin --clobber
          if [ -f PipAI.version ]; then gh release upload latest PipAI.version --clobber; fi

      - name: Label the release and add PipAI.bin to this version's archive
        if: hashFiles('PipAI.version') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FW=$(cat PipAI.version)
          . ./PipAI.models   # B and V: the brain and voice versions compiled into this PipAI.bin
          # The website reads this line to show which version is on GitHub right now
          gh release edit latest --notes "PipAI version $FW · brain v$B · voice v$V · built $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Flash PipAI.bin with https://espressif.github.io/esptool-js/ at address 0x0. Pip also downloads new versions by itself over Wi-Fi."
          TAG="pip-b$B-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            cp PipAI.bin "PipAI-v$FW.bin"
            gh release upload "$TAG" "PipAI-v$FW.bin" --clobber
            echo "Added PipAI-v$FW.bin to $TAG"
          fi
