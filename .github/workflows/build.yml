name: Build sketches

on:
  push:
    branches-ignore: [status]
    paths:  # only when a program's code changes (website/training pushes don't need a build)
      - "EpaperHello/**"
      - "EpaperPet/**"
      - "PipAI/**"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:
  workflow_run:  # rebuild after a new brain is trained
    workflows: ["Train Pip brain"]
    types: [completed]

permissions:
  contents: write  # lets the build publish the "latest" download

# One build at a time. A newer waiting build replaces an older waiting one, but a
# build that's already running is never cancelled.
concurrency:
  group: build
  cancel-in-progress: false

env:
  # min_spiffs = two 1.9 MB program slots, so Pip can download an update into the
  # spare slot over Wi-Fi and switch to it (PipAI is about 1.3 MB)
  FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=min_spiffs

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a normal build takes ~5 min; never sit for GitHub's 6-hour default
    strategy:
      fail-fast: false
      matrix:
        sketch: [EpaperHello, EpaperPet, PipAI]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

      - name: Check the sketch is ready
        id: ready
        run: |
          if [ "${{ matrix.sketch }}" = "PipAI" ] && { [ ! -f PipAI/pip_brain.h ] || [ ! -f PipAI/pip_voice.h ]; }; then
            echo "PipAI's brain or voice hasn't been trained yet - skipping until training finishes."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: arduino/setup-arduino-cli@v2
        if: steps.ready.outputs.go == 'true'

      - name: Install ESP32 core and libraries
        if: steps.ready.outputs.go == 'true'
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install GxEPD2

      - name: Stamp the version number (Pip compares it to decide whether to update)
        if: steps.ready.outputs.go == 'true' && matrix.sketch == 'PipAI'
        run: |
          echo "#define PIP_FW_VERSION ${{ github.run_number }}" > PipAI/pip_version.h
          echo "PipAI version ${{ github.run_number }}"

      - name: Compile
        if: steps.ready.outputs.go == 'true'
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build ${{ matrix.sketch }}

      - name: Name the program files
        if: steps.ready.outputs.go == 'true'
        run: |
          cp build/${{ matrix.sketch }}.ino.merged.bin ${{ matrix.sketch }}.bin    # whole flash, for esptool-js at 0x0
          if [ "${{ matrix.sketch }}" = "PipAI" ]; then
            cp build/PipAI.ino.bin PipAI-ota.bin                             # just the program, for Wi-Fi updates
            echo "${{ github.run_number }}" > PipAI.version
            ls -l PipAI-ota.bin
          fi

      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: ${{ matrix.sketch }}
          path: |
            ${{ matrix.sketch }}.bin
            PipAI-ota.bin
            PipAI.version

  publish:
    # Put the newest program files on the "latest" release page for easy download.
    needs: build
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest program files" \
              --notes "Flash with https://espressif.github.io/esptool-js/ at address 0x0."
          # Upload the program first and the version number last, so Pip never sees a new
          # version number before the matching program is there to download.
          gh release upload latest *.bin --clobber
          if [ -f PipAI.version ]; then gh release upload latest PipAI.version --clobber; fi
