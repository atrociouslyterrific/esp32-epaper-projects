name: Build sketches

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # lets the build publish the "latest" download

env:
  FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [EpaperHello, EpaperPet]
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install GxEPD2

      - name: Compile
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build ${{ matrix.sketch }}

      - name: Name the program file
        run: cp build/${{ matrix.sketch }}.ino.merged.bin ${{ matrix.sketch }}.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sketch }}
          path: ${{ matrix.sketch }}.bin

  publish:
    # Put the newest program files on the "latest" release page for easy download.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest program files" \
              --notes "Flash with https://espressif.github.io/esptool-js/ at address 0x0."
          gh release upload latest EpaperHello.bin EpaperPet.bin --clobber
