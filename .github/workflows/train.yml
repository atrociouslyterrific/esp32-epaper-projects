name: Train Pip brain

# Trains Pip's neural network and its voice model on GitHub's computers (never on your Mac),
# checks the C version matches, and saves the trained brain into PipAI/pip_brain.h.
# Every hour it picks up from the last saved version (the "checkpoints" release) and keeps
# training; a new version only replaces the old one if it tests at least as well.
on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour
  push:
    branches: [main]
    paths:
      - "training/**"
      - "PipAI/pip_world.h"
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Start from scratch instead of continuing from the last version"
        type: boolean
        default: false
      fresh_brain:
        description: "Retrain only the brain from scratch (after changing Pip's world rules); the voice keeps training"
        type: boolean
        default: false
      from_version:
        description: "Continue from a saved version instead of the newest, e.g. pip-b3-v3 (leave empty for newest)"
        type: string
        default: ""

permissions:
  contents: write

# (renamed from "train": runs left over from GitHub's earlier outage are stuck in that group)
concurrency:
  group: train-v2
  cancel-in-progress: false  # a run that's due waits for the current one instead of cancelling it

jobs:
  train:
    # Never react to the bot's own "Update Pip's trained brain" commit (that commit
    # changes training/, so without this guard it could retrain itself forever).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm  # ARM pool: the x64 ubuntu-latest/24.04 runners stopped picking up jobs (Nov 2026)
    timeout-minutes: 150  # a from-scratch run of the big models can take over an hour
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU) and numpy
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Get the last saved brain and voice (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training/ckpt
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then echo "Starting fresh as requested"; exit 0; fi
          FROM="${{ github.event.inputs.from_version }}"
          if [ -n "$FROM" ]; then
            echo "Continuing from saved version $FROM"
            gh release download "$FROM" -R "${{ github.repository }}" -D training/ckpt -p 'brain.pt' -p 'voice.pt'
            exit 0
          fi
          gh release download checkpoints -R "${{ github.repository }}" -D training/ckpt -p 'brain.pt' -p 'voice.pt' \
            && ls -la training/ckpt || echo "No checkpoints yet - training from scratch"

      - name: Get the training history so far
        run: |
          mkdir -p training/out
          curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/status/status.json" -o training/out/prev_status.json \
            || echo "{}" > training/out/prev_status.json

      - name: Train (live progress goes to the status website)
        env:
          PIP_FRESH_BRAIN: ${{ github.event.inputs.fresh_brain == 'true' && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git update-index --chmod=+x training/push_status.sh 2>/dev/null; chmod +x training/push_status.sh
          (python training/train.py && python training/train_voice.py) &
          TRAIN_PID=$!
          while kill -0 $TRAIN_PID 2>/dev/null; do
            sleep 20
            training/push_status.sh || true
          done
          wait $TRAIN_PID

      - name: Check the C brain + world match Python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gcc -O2 -I PipAI training/test_world.c -lm -o test_world
          set +e
          ./test_world training/out/trajectory.txt | tee test.txt
          result=${PIPESTATUS[0]}
          gcc -O2 -I PipAI training/test_voice.c -lm -o test_voice
          ./test_voice training/out/voice_test.txt | tee -a test.txt
          vresult=${PIPESTATUS[0]}
          [ "$result" = 0 ] && result=$vresult
          set -e
          python - "$result" <<'EOF'
          import json, sys
          p = "training/out/status.json"
          s = json.load(open(p))
          s["c_test"] = "pass" if sys.argv[1] == "0" else "fail"
          s["c_test_detail"] = open("test.txt").read().strip()
          s["state"] = "done" if sys.argv[1] == "0" else "failed"
          v = s.get("voice", {})
          # All-time totals across every training run
          t = s.setdefault("totals", {})
          this = {"brain_updates": s.get("update") or 0, "brain_seconds": s.get("elapsed_s") or 0,
                  "voice_steps": v.get("step") or 0, "voice_seconds": v.get("elapsed_s") or 0,
                  "sim_minutes": s.get("sim_minutes") or 0, "chars_read": v.get("chars_read") or 0}
          for k, val in this.items():
              t[k] = t.get(k, 0) + val
          t["runs"] = t.get("runs", 0) + 1
          t.setdefault("first_run", s.get("started"))
          t["last_run"] = s.get("updated")
          s.setdefault("history", []).append({**this,
              "date": s.get("updated"), "mode": s.get("mode"), "commit": s.get("commit"),
              "brain_version": s.get("brain_version"), "brain_kept": s.get("kept"),
              "score": s.get("score"), "old_score": s.get("old_score"),
              "voice_version": v.get("version"), "voice_kept": v.get("kept"),
              "voice_loss": v.get("test_loss"), "old_voice_loss": v.get("old_test_loss"),
              "c_test": s["c_test"]})
          s["history"] = s["history"][-60:]
          json.dump(s, open(p, "w"))
          EOF
          training/push_status.sh
          exit $result

      - name: Tell the status website if training crashed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import json, os
          p = "training/out/status.json"
          s = json.load(open(p)) if os.path.exists(p) else {}
          if s.get("state") not in ("done",):
              s["state"] = "failed"
          os.makedirs("training/out", exist_ok=True)
          json.dump(s, open(p, "w"))
          EOF
          bash training/push_status.sh || true

      - name: Personality report
        run: cat training/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: training-output
          path: |
            training/out/
            PipAI/pip_brain.h
            PipAI/pip_voice.h

      - name: Save checkpoints for the next training run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release view checkpoints -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create checkpoints -R "${{ github.repository }}" --prerelease --title "Training checkpoints" \
              --notes "Saved brain and voice models so nightly training continues where it left off. Not for flashing."
          # The trained models live here (not in the repo, which would grow by ~1.5 MB every hour).
          # The build downloads pip_brain.h / pip_voice.h from this release.
          gh release upload checkpoints -R "${{ github.repository }}" --clobber \
            training/out/ckpt/brain.pt training/out/ckpt/voice.pt PipAI/pip_brain.h PipAI/pip_voice.h
          # ...and a copy for the status website (status branch, which is always a single commit)
          mkdir -p training/out/models && cp PipAI/pip_brain.h PipAI/pip_voice.h training/out/models/
          bash training/push_status.sh

      - name: Archive this version (its own release, so it can be flashed or trained from later)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF' > archive.env
          import json
          s = json.load(open("training/out/status.json")); v = s.get("voice", {})
          kept_something_new = s.get("kept") == "new" or v.get("kept") == "new"
          print(f"B={s.get('brain_version')}")
          print(f"V={v.get('version')}")
          print(f"NEW={'yes' if kept_something_new else 'no'}")
          print(f"SCORE={s.get('score')}")
          print(f"LOSS={v.get('test_loss')}")
          EOF
          . ./archive.env
          if [ "$NEW" != "yes" ]; then echo "Nothing new was kept this time - no new archive"; exit 0; fi
          TAG="pip-b$B-v$V"
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "${{ github.repository }}" --prerelease --title "Pip brain v$B · voice v$V" \
              --notes "Saved version of Pip. Brain test score $SCORE (higher is better), voice test loss $LOSS (lower is better). Trained $(date -u +%Y-%m-%dT%H:%MZ) by run ${{ github.run_id }}. PipAI.bin is added when it has been built. To keep training from this version: Actions > Train Pip brain > Run workflow > from_version = $TAG"
          cp training/out/report.md personality_report.md
          gh release upload "$TAG" -R "${{ github.repository }}" --clobber \
            training/out/ckpt/brain.pt training/out/ckpt/voice.pt PipAI/pip_brain.h PipAI/pip_voice.h personality_report.md
          echo "Archived as $TAG"

      - name: Save the personality report to the repo (small; the models themselves live in releases)
        run: |
          cp training/out/report.md training/personality_report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add training/personality_report.md
          git diff --cached --quiet && exit 0
          git commit -m "Update Pip's personality report [skip ci]"
          # Other commits may have landed while training ran: rebase and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
