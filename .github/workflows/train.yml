name: Train Pip brain

# Trains Pip's neural network and its voice model on GitHub's computers (never on your Mac),
# checks the C version matches, and saves the trained brain into PipAI/pip_brain.h.
# Every night it picks up from the last saved version (the "checkpoints" release) and keeps
# training; a new version only replaces the old one if it tests at least as well.
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 3 AM in the user's time zone (UTC-6)
  push:
    branches: [main]
    paths:
      - "training/**"
      - "PipAI/pip_world.h"
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Start from scratch instead of continuing from the last version"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: true

jobs:
  train:
    # Never react to the bot's own "Update Pip's trained brain" commit (that commit
    # changes training/, so without this guard it could retrain itself forever).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU) and numpy
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Get the last saved brain and voice (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training/ckpt
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then echo "Starting fresh as requested"; exit 0; fi
          gh release download checkpoints -R "${{ github.repository }}" -D training/ckpt -p 'brain.pt' -p 'voice.pt' \
            && ls -la training/ckpt || echo "No checkpoints yet - training from scratch"

      - name: Train (live progress goes to the status website)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git update-index --chmod=+x training/push_status.sh 2>/dev/null; chmod +x training/push_status.sh
          (python training/train.py && python training/train_voice.py) &
          TRAIN_PID=$!
          while kill -0 $TRAIN_PID 2>/dev/null; do
            sleep 20
            training/push_status.sh || true
          done
          wait $TRAIN_PID

      - name: Check the C brain + world match Python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gcc -O2 -I PipAI training/test_world.c -lm -o test_world
          set +e
          ./test_world training/out/trajectory.txt | tee test.txt
          result=${PIPESTATUS[0]}
          gcc -O2 -I PipAI training/test_voice.c -lm -o test_voice
          ./test_voice training/out/voice_test.txt | tee -a test.txt
          vresult=${PIPESTATUS[0]}
          [ "$result" = 0 ] && result=$vresult
          set -e
          python - "$result" <<'EOF'
          import json, sys
          p = "training/out/status.json"
          s = json.load(open(p))
          s["c_test"] = "pass" if sys.argv[1] == "0" else "fail"
          s["c_test_detail"] = open("test.txt").read().strip()
          s["state"] = "done" if sys.argv[1] == "0" else "failed"
          json.dump(s, open(p, "w"))
          EOF
          training/push_status.sh
          exit $result

      - name: Tell the status website if training crashed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import json, os
          p = "training/out/status.json"
          s = json.load(open(p)) if os.path.exists(p) else {}
          if s.get("state") not in ("done",):
              s["state"] = "failed"
          os.makedirs("training/out", exist_ok=True)
          json.dump(s, open(p, "w"))
          EOF
          bash training/push_status.sh || true

      - name: Personality report
        run: cat training/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: training-output
          path: |
            training/out/
            PipAI/pip_brain.h
            PipAI/pip_voice.h

      - name: Save checkpoints for tomorrow's training
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view checkpoints -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create checkpoints -R "${{ github.repository }}" --prerelease --title "Training checkpoints" \
              --notes "Saved brain and voice models so nightly training continues where it left off. Not for flashing."
          gh release upload checkpoints -R "${{ github.repository }}" training/out/ckpt/brain.pt training/out/ckpt/voice.pt --clobber

      - name: Save the trained brain to the repo
        run: |
          cp training/out/report.md training/personality_report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add PipAI/pip_brain.h PipAI/pip_voice.h training/personality_report.md
          git diff --cached --quiet && exit 0
          git commit -m "Update Pip's trained brain [skip ci]"
          # Other commits may have landed while training ran: rebase and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
